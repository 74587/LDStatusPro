name: Deploy Pages

# Production Pages deploys stay manual. A push only runs CI.
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Storefront also requires VITE_FARO_API_KEY (at least 16 characters).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare Pages project
        required: true
        type: choice
        options:
          - storefront
          - website

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  storefront:
    name: Deploy storefront
    if: github.ref == 'refs/heads/main' && inputs.target == 'storefront'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ld-store
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ld-store/package-lock.json
      - name: Require production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_FARO_API_KEY: ${{ secrets.VITE_FARO_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "${#VITE_FARO_API_KEY}" -ge 16 || { echo "Missing repository secret VITE_FARO_API_KEY"; exit 1; }
      - run: npm ci
      - name: Deploy ld-store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_FARO_API_KEY: ${{ secrets.VITE_FARO_API_KEY }}
        run: bash scripts/deploy-pages-production.sh

  website:
    name: Deploy website
    if: github.ref == 'refs/heads/main' && inputs.target == 'website'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Require production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Deploy ldstatus-pro
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy dist --project-name=ldstatus-pro --branch main --commit-dirty=true
