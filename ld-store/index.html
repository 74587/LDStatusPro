<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="在 LD士多 使用 Linux.do 社区积分兑换精选虚拟物品与服务。">
  <meta name="keywords" content="LD士多,LDC,积分商城,linux.do">
  <meta name="theme-color" content="#b5a898">

  <!--
    在首个样式与 Vue 入口加载前恢复主题，避免深色模式刷新时先绘制浅色背景。
    这里只保留首屏必需的背景色，完整主题仍由 main.css 管理。
  -->
  <script>
    ;(() => {
      let themeMode = 'system'

      try {
        themeMode = localStorage.getItem('ld-store-theme') || themeMode
      } catch {
        // localStorage 不可用时回退到系统主题
      }

      const shouldUseDarkTheme = themeMode === 'dark'
        || (themeMode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)

      document.documentElement.classList.toggle('dark', shouldUseDarkTheme)
    })()
  </script>
  <style>
    html {
      min-height: 100%;
      background-color: #faf9f7;
      color-scheme: light;
    }

    html.dark {
      background-color: #121212;
      color-scheme: dark;
    }

    body,
    #app {
      min-height: 100%;
    }

    body {
      margin: 0;
      background-color: inherit;
    }
  </style>
  
  <!-- 允许抓取但禁止收录，便于统计与预览 -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="canonical" href="https://ldcstore.com/">
  
  <!-- Open Graph -->
  <meta property="og:title" content="LD士多 - Linux DO 社区积分兑换中心">
  <meta property="og:description" content="在 LD士多 使用 Linux.do 社区积分兑换精选虚拟物品与服务。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ldcstore.com/">
  <meta property="og:site_name" content="LD士多">
  <meta property="og:image" content="https://ldcstore.com/og/default/base.png?v=1">
  <meta property="og:image:secure_url" content="https://ldcstore.com/og/default/base.png?v=1">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="LD士多 - Linux DO 社区积分兑换中心">
  <meta property="og:locale" content="zh_CN">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LD士多 - Linux DO 社区积分兑换中心">
  <meta name="twitter:description" content="在 LD士多 使用 Linux.do 社区积分兑换精选虚拟物品与服务。">
  <meta name="twitter:image" content="https://ldcstore.com/og/default/base.png?v=1">
  <meta name="twitter:image:alt" content="LD士多 - Linux DO 社区积分兑换中心">
  
  <!-- oEmbed Discovery -->
  <link rel="alternate" type="application/json+oembed" href="https://ldcstore.com/oembed.json?url=https%3A%2F%2Fldcstore.com%2F" title="LD士多">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  
  <!-- 预连接优化?-->
  <link rel="preconnect" href="https://api2.ldspro.qzz.io">
  <link rel="preconnect" href="https://api1.ldspro.qzz.io">
  <link rel="preconnect" href="https://api.ldspro.qzz.io">
  <link rel="preconnect" href="https://credit.linux.do">
  <link rel="preconnect" href="https://img.ldspro.qzz.io">
  
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>LD士多 - Linux DO 社区积分兑换中心</title>

  <!-- 统计 SDK 独立加载，不阻塞首屏 CSS 与应用入口的发现/执行。 -->

    async
    charset="UTF-8"
    id="MXA_COLLECT"
    src="https://mxana.tacool.com/sdk.js"
    onload="window.MXA?.init({ id: 'c2-9FYYP0Vm' })"
  ></script>
</head>
<body>

</body>
